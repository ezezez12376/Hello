<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thử thách tình bạn</title>
    <link rel="stylesheet" href="style.css">
  <nav>
    <div class="logo">tét <span>tình</span> bạn
    </div>
  </nav>

  <header class="hero">
    <div>
      <div class="card names">
        <label>Tên của bạn<input id="n1" placeholder="Ví dụ: tung tung sahur" maxlength="20" autocomplete="off"></label>
        <button id="go" type="button">Bắt đầu tạo câu hỏi</button>
        <p class="msg" id="msg" aria-live="polite"></p>
      </div>
    </div>
    <div class="duo" aria-hidden="true">
      <div class="heart">♥</div>
      <div class="blob a"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
      <div class="blob b"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
      <div class="hand">
        🤝
      </div>
    </div>
  </header>

  <section>
    <h2>Chơi kiểu đéo j?</h2>
    <div class="steps">
      <div class="card step"><b>1</b><h3>Nhập tên</h3><p>sau đó tạo câu hỏi</p></div>
      <div class="card step"><b>2</b><h3>Trả lời 10 câu</h3></div>
      <div class="card step"><b>3</b><h3>check điểm</h3><p>gửi link cho nó làm.</p></div>
    </div>
  </section>
  <footer>Làm cho vui thôi nhé 💛</footer>
</div>

</body>
</html>
